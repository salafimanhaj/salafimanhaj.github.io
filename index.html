<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios Index</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-6">

    <div class="max-w-3xl mx-auto px-4 py-10">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Audio Library Index</h1>
            <p class="text-slate-500 mt-2">alsalafiyyah.github.io/</p>
        </header>

        <!-- Dynamic Content Container -->
        <div id="audio-container" class="space-y-6">
            <div class="text-center py-12 text-slate-500 animate-pulse">Scanning repository for audios...</div>
        </div>
    </div>

    <!-- Toast Notification for Copy -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm transition-opacity duration-300 opacity-0 pointer-events-none">
        Link copied to clipboard!
    </div>

    <script>
        const username = "salafimanhaj";
        const repoName = "audios";

        function formatTitle(filename) {
            return filename
                .replace('.mp3', '')
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, l => l.toUpperCase());
        }

        function formatScholarName(folderName) {
            return folderName.replace(/[-_]/g, ' ');
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        async function fetchAudioLibrary() {
            const container = document.getElementById('audio-container');
            
            try {
                const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/assets`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error("Could not fetch repository contents.");
                
                const scholars = await response.json();
                const groupedAudios = {};

                for (const scholarFolder of scholars) {
                    if (scholarFolder.type === "dir") {
                        const scholarName = scholarFolder.name;
                        const subResponse = await fetch(scholarFolder.url);
                        const files = await subResponse.json();

                        groupedAudios[scholarName] = [];

                        for (const file of files) {
                            if (file.type === "file" && file.name.endsWith('.mp3')) {
                                groupedAudios[scholarName].push({
                                    title: formatTitle(file.name),
                                    url: `https://${username}.github.io/${repoName}/assets/${scholarName}/${file.name}`
                                });
                            }
                        }

                        if (groupedAudios[scholarName].length === 0) {
                            delete groupedAudios[scholarName];
                        }
                    }
                }

                container.innerHTML = '';
                
                if (Object.keys(groupedAudios).length === 0) {
                    container.innerHTML = '<div class="text-center py-12 bg-white rounded-xl shadow-sm border border-slate-200 text-slate-500">No audio files found.</div>';
                    return;
                }

                for (const [scholar, audios] of Object.entries(groupedAudios)) {
                    // Scholar Section Wrapper
                    const section = document.createElement('div');
                    section.className = "bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6";

                    // Scholar Name Heading
                    const scholarHeading = document.createElement('h2');
                    scholarHeading.className = "text-xl font-semibold text-blue-600 capitalize pb-3 mb-4 border-b border-slate-100 flex items-center gap-2";
                    scholarHeading.innerHTML = `<span>Shaykh</span> ${formatScholarName(scholar)}`;
                    section.appendChild(scholarHeading);

                    // Audios List Wrapper
                    const listDiv = document.createElement('div');
                    listDiv.className = "space-y-6";

                    audios.forEach((audio, index) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = index !== audios.length - 1 ? "pb-6 border-b border-slate-100" : "";

                        // Header with Title and Copy Button
                        const topRow = document.createElement('div');
                        topRow.className = "flex items-start justify-between gap-4 mb-3";

                        const titleSpan = document.createElement('span');
                        titleSpan.className = "font-medium text-slate-900 leading-snug";
                        titleSpan.textContent = audio.title;

                        // Copy Button
                        const copyBtn = document.createElement('button');
                        copyBtn.className = "shrink-0 inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors px-3 py-1.5 rounded-lg active:scale-95";
                        copyBtn.innerHTML = `
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Copy Link
                        `;
                        copyBtn.onclick = () => {
                            navigator.clipboard.writeText(audio.url);
                            showToast();
                        };

                        topRow.appendChild(titleSpan);
                        topRow.appendChild(copyBtn);

                        // Audio Player
                        const audioElement = document.createElement('audio');
                        audioElement.controls = true;
                        audioElement.className = "w-full h-10 accent-blue-600";
                        audioElement.src = audio.url;

                        itemDiv.appendChild(topRow);
                        itemDiv.appendChild(audioElement);
                        listDiv.appendChild(itemDiv);
                    });

                    section.appendChild(listDiv);
                    container.appendChild(section);
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="text-center py-12 bg-white rounded-xl shadow-sm border border-slate-200 text-red-500">Error loading audio files automatically.</div>';
            }
        }

        fetchAudioLibrary();
    </script>
</body>
</html>
